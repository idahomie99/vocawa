<script>
  let myHanjaData = [];
  let todayCards = [];
  let currentIndex = 0;
  let completedCount = 0;

  // 💡 1. 외부 JSON 파일 불러오기 및 데이터 병합 (핵심 업데이트)
  function loadData() {
    // 깃허브(또는 같은 폴더)에 있는 data.json을 비동기로 불러옴
    fetch('./data.json')
      .then(response => response.json())
      .then(fetchedData => {
        // 유저의 기존 학습 기록(로컬 스토리지)을 가져옴
        const savedData = localStorage.getItem('vocawaData');
        let localData = savedData ? JSON.parse(savedData) : [];
        
        // 💡 엑셀(JSON)에 새 한자가 추가되었는지 확인하고 병합
        fetchedData.forEach(card => {
          // 기존 학습 기록에 없는 새로운 ID의 한자라면?
          if (!localData.find(c => c.id === card.id)) {
            // 초기 복습 날짜(0)를 부여해서 내 단어장에 추가
            localData.push({
              ...card,
              interval: 0,
              nextReview: 0
            });
          }
        });
        
        myHanjaData = localData;
        
        // 병합된 최신 데이터를 다시 저장
        localStorage.setItem('vocawaData', JSON.stringify(myHanjaData));
        updateHomeStatus();
      })
      .catch(error => {
        console.error("데이터 로드 에러:", error);
        document.getElementById('courseStatus').innerText = "데이터 연결 실패 😢";
      });
  }

  // 💡 2. 홈 화면 세팅 로직
  function updateHomeStatus() {
    const now = new Date().getTime();
    todayCards = myHanjaData.filter(card => card.nextReview <= now);
    
    const statusText = todayCards.length > 0 
      ? `오늘 복습할 한자: ${todayCards.length}개` 
      : `오늘의 학습을 모두 마쳤습니다! ✨`;
    document.getElementById('courseStatus').innerText = statusText;
  }

  // 💡 3. 학습 화면 시작
  function startLearning() {
    document.getElementById('homeScreen').classList.remove('active');
    document.getElementById('learningScreen').classList.add('active');
    
    const now = new Date().getTime();
    todayCards = myHanjaData.filter(card => card.nextReview <= now);
    
    currentIndex = 0;
    completedCount = 0;
    updateProgress();

    if (todayCards.length > 0) {
      document.getElementById('emptyState').classList.remove('show');
      document.getElementById('cardContainer').style.display = 'block';
      renderCard(currentIndex);
    } else {
      document.getElementById('cardContainer').style.display = 'none';
      document.getElementById('emptyState').classList.add('show');
    }
    
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('evalButtons').classList.remove('show');
  }

  function renderCard(index) {
    if (index >= todayCards.length) return;
    const data = todayCards[index];
    document.getElementById('cardHanja').innerText = data.hanja;
    document.getElementById('cardMiniHanja').innerText = data.hanja; 
    document.getElementById('cardMeaning').innerText = data.meaning;
    document.getElementById('cardRadical').innerText = data.radical;
    document.getElementById('cardStory').innerText = data.story;
  }

  function flipCard() {
    const card = document.getElementById('flashcard');
    if (!card.classList.contains('flipped')) {
      card.classList.add('flipped');
      document.getElementById('evalButtons').classList.add('show');
    }
  }

  // 💡 4. 장기 기억(SRS) 평가 로직
  function processEvaluation(result) {
    let currentCard = todayCards[currentIndex];
    let originalCard = myHanjaData.find(c => c.id === currentCard.id);
    
    const ONE_DAY = 24 * 60 * 60 * 1000;
    const now = new Date().getTime();

    if (result === '모름') {
      originalCard.interval = 0;
      originalCard.nextReview = now; 
    } else if (result === '헷갈림') {
      originalCard.interval = 1;
      originalCard.nextReview = now + ONE_DAY;
    } else if (result === '완벽함') {
      originalCard.interval = originalCard.interval === 0 ? 3 : originalCard.interval * 2;
      originalCard.nextReview = now + (originalCard.interval * ONE_DAY);
    }

    localStorage.setItem('vocawaData', JSON.stringify(myHanjaData));

    completedCount++;
    updateProgress();
    currentIndex++;
    
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('evalButtons').classList.remove('show');
    
    if (currentIndex >= todayCards.length) {
      setTimeout(() => {
        document.getElementById('completionModal').classList.add('show');
      }, 500); 
    } else {
      setTimeout(() => {
         renderCard(currentIndex);
      }, 150);
    }
  }

  function goHome() {
    document.getElementById('learningScreen').classList.remove('active');
    document.getElementById('homeScreen').classList.add('active');
    updateHomeStatus();
  }

  function resetAndGoHome() {
    document.getElementById('completionModal').classList.remove('show');
    setTimeout(() => {
      goHome();
    }, 300);
  }

  function updateProgress() {
    if (todayCards.length === 0) return;
    const progressPercent = (completedCount / todayCards.length) * 100;
    document.getElementById('progressBar').style.width = progressPercent + '%';
  }

  // 앱 실행 시 외부 파일 데이터 로드
  loadData();

  // 💡 서비스 워커 등록 (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('ServiceWorker 등록 성공');
        })
        .catch(error => {
          console.log('ServiceWorker 등록 실패', error);
        });
    });
  }
</script>
</body>
</html>
